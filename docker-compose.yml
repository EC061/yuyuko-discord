# 1Panel-compatible Docker Compose template
# Paste this into 1Panel -> Containers -> Compose, and put GAMEVOX_BOT_TOKEN & WG_APPLICATION_ID
# into 1Panel's built-in "环境变量" box (or a local .env file when running docker compose locally).

services:
  wows-gamevox-bot:
    image: ghcr.io/ec061/yuyuko-discord:latest
    container_name: wows-gamevox-bot
    restart: unless-stopped
    init: true
    shm_size: "512m"
    environment:
      GAMEVOX_BOT_TOKEN: ${GAMEVOX_BOT_TOKEN}
      WG_APPLICATION_ID: ${WG_APPLICATION_ID}
      GAMEVOX_API_BASE: ${GAMEVOX_API_BASE:-https://app-api.gamevox.com/api/v10}
      GAMEVOX_GATEWAY_URL: ${GAMEVOX_GATEWAY_URL:-wss://gateway.gamevox.com/?v=10&encoding=json}
      DEFAULT_GUILD_ID: ${DEFAULT_GUILD_ID:-1487625003808419840}
      DEFAULT_AUTO_POST_CHANNEL_ID: ${DEFAULT_AUTO_POST_CHANNEL_ID:-1574077276956221440}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-zh}
      DEFAULT_REALM: ${DEFAULT_REALM:-na}
      COMMAND_PREFIX: ${COMMAND_PREFIX:-wws}
      DATA_DIR: /data
      DB_PATH: /data/wows_bot.db
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
      ENABLE_YUYUKO_SHIP_RANK: ${ENABLE_YUYUKO_SHIP_RANK:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
