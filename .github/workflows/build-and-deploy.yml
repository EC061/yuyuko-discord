name: Test, Multi-Arch GHCR Build & SSH Deploy

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with ruff
        run: uv run ruff check src tests
      - name: Run pytest
        run: uv run pytest -v

  build:
    name: Native Build (${{ matrix.platform }})
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lowercase image name
        id: meta
        run: echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Arch Manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.manifest.outputs.image_tag }}
    steps:
      - name: Lowercase image name
        id: meta
        run: echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest list
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG_ARGS=(-t "${IMAGE_REF}:sha-${SHORT_SHA}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAG_ARGS+=(-t "${IMAGE_REF}:latest")
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAG_ARGS+=(-t "${IMAGE_REF}:${TAG_NAME}")
          fi

          DIGEST_REFS=()
          for f in *; do
            DIGEST_REFS+=("${IMAGE_REF}@sha256:${f}")
          done

          docker buildx imagetools create "${TAG_ARGS[@]}" "${DIGEST_REFS[@]}"
          docker buildx imagetools inspect "${IMAGE_REF}:sha-${SHORT_SHA}"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Oracle ARM VPS via SSH
    needs: merge
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check SSH secrets configured
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_COMPOSE_DIR: ${{ secrets.VPS_COMPOSE_DIR }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_COMPOSE_DIR" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SSH deploy: configure VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_COMPOSE_DIR repo secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH (1Panel Compose directory)
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_COMPOSE_DIR: ${{ secrets.VPS_COMPOSE_DIR }}
          IMAGE_TAG: ${{ needs.merge.outputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: VPS_COMPOSE_DIR,IMAGE_TAG
          script: |
            set -euo pipefail
            if sudo -n true 2>/dev/null; then
              sudo mkdir -p "${VPS_COMPOSE_DIR}/data"
              sudo chown -R 10001:10001 "${VPS_COMPOSE_DIR}/data"
              sudo bash -c "cd \"${VPS_COMPOSE_DIR}\" && docker compose pull && docker compose up -d --remove-orphans && docker compose ps"
            else
              mkdir -p "${VPS_COMPOSE_DIR}/data"
              cd "${VPS_COMPOSE_DIR}"
              docker compose pull
              docker compose up -d --remove-orphans
              docker compose ps
            fi
