name: Test, Multi-Arch GHCR Build & SSH Deploy

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with ruff
        run: uv run ruff check src tests
      - name: Run pytest
        run: uv run pytest -v

  build:
    name: Native Build (${{ matrix.platform }})
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lowercase image name
        id: meta
        run: echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Arch Manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.manifest.outputs.image_tag }}
    steps:
      - name: Lowercase image name
        id: meta
        run: echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest list
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG_ARGS=(-t "${IMAGE_REF}:sha-${SHORT_SHA}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAG_ARGS+=(-t "${IMAGE_REF}:latest")
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAG_ARGS+=(-t "${IMAGE_REF}:${TAG_NAME}")
          fi

          DIGEST_REFS=()
          for f in *; do
            DIGEST_REFS+=("${IMAGE_REF}@sha256:${f}")
          done

          docker buildx imagetools create "${TAG_ARGS[@]}" "${DIGEST_REFS[@]}"
          docker buildx imagetools inspect "${IMAGE_REF}:sha-${SHORT_SHA}"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Oracle ARM VPS via SSH
    needs: merge
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check SSH secrets configured
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_COMPOSE_DIR: ${{ secrets.VPS_COMPOSE_DIR }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_COMPOSE_DIR" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SSH deploy: configure VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS, VPS_COMPOSE_DIR repo secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via native OpenSSH (1Panel Compose directory)
        if: steps.check.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_COMPOSE_DIR: ${{ secrets.VPS_COMPOSE_DIR }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT

          ssh -i ~/.ssh/deploy_key \
              -p "${VPS_PORT}" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o BatchMode=yes \
              "${VPS_USER}@${VPS_HOST}" \
              bash -s -- "${VPS_COMPOSE_DIR}" <<'REMOTE'
          set -euo pipefail
          COMPOSE_DIR="$1"
          if sudo -n true 2>/dev/null; then
            sudo mkdir -p "${COMPOSE_DIR}/data"
            sudo bash -c 'cd "$1" && docker compose pull && docker compose down && chown -R 10001:10001 "${1}/data" && docker compose up -d --remove-orphans && docker compose ps' _ "${COMPOSE_DIR}"
          else
            mkdir -p "${COMPOSE_DIR}/data"
            cd "${COMPOSE_DIR}"
            docker compose pull
            docker compose down
            docker compose up -d --remove-orphans
            docker compose ps
          fi
          REMOTE
