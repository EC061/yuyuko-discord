name: Upstream & Contract Watcher

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    name: Monitor Upstream Repos & Public API Contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check Yuyuko org, honker releases, and public endpoints
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request

          repo = os.environ["REPO"]

          def fetch_json(url: str, headers=None):
              req = urllib.request.Request(url, headers=headers or {"User-Agent": "wows-gamevox-bot-watcher"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return r.status, json.loads(r.read().decode("utf-8"))

          alerts = []

          # 1. Contract check: Yuyuko public ship.rank endpoint (no token)
          try:
              status, data = fetch_json("https://v3-api.wows.shinoaki.com/public/rank/yuyuko_ship/na?shipId=4276041424&page=1")
              if status != 200 or data.get("code") != 200 or not isinstance((data.get("data") or {}).get("value"), list):
                  alerts.append(("yuyuko-ship-rank-contract", "Yuyuko `/public/rank/yuyuko_ship/na` contract changed", f"HTTP {status}, code={data.get('code')}. Bot will fall back to local leaderboard until `yuyuko_rank.py` is updated."))
          except Exception as e:
              alerts.append(("yuyuko-ship-rank-contract", "Yuyuko `/public/rank/yuyuko_ship/na` unreachable", f"Error: `{e}`. Check if Yuyuko migrated to a new API version (e.g. v4)."))

          # 2. Contract check: WoWS Numbers PR expected JSON
          try:
              status, data = fetch_json("https://api.wows-numbers.com/personal/rating/expected/json/")
              if status != 200 or not isinstance(data.get("data"), dict) or len(data["data"]) < 200:
                  alerts.append(("wows-numbers-pr-contract", "WoWS Numbers PR expected JSON schema changed", f"HTTP {status}, entries={len(data.get('data') or {})}."))
          except Exception as e:
              alerts.append(("wows-numbers-pr-contract", "WoWS Numbers PR expected JSON unreachable", f"Error: `{e}`."))

          # 3. Watch wows-yuyuko org for newly created repos (e.g. an open-sourced backend!)
          known_yuyuko_repos = {
              "wows-mgaia-vue3", "mgaia-wows-pc", "WowsWebSocketServer", "WowsApi",
              "Hikari-core", "wows-real", "ru_box_translate", "HikariBot-Official",
              "lesta_data", "wows-replay-wg", "Hikari-core-v2", "wows-sandbox-build-constants",
              "wows-yuyuko-christmas-cn-port-user", "wows-exporter-3dmodel", ".github",
          }
          try:
              _, repos = fetch_json("https://api.github.com/orgs/wows-yuyuko/repos?per_page=100")
              new_repos = [r["name"] for r in repos if r["name"] not in known_yuyuko_repos]
              if new_repos:
                  alerts.append((
                      "yuyuko-new-repo",
                      f"Upstream wows-yuyuko published new repo(s): {', '.join(new_repos)}",
                      "New repositories detected in `https://github.com/wows-yuyuko`:\n" + "\n".join(f"- https://github.com/wows-yuyuko/{n}" for n in new_repos),
                  ))
          except Exception as e:
              print(f"Skipping org check: {e}")

          # 4. Watch russellromney/honker releases
          try:
              _, rel = fetch_json("https://api.github.com/repos/russellromney/honker/releases/latest")
              tag = rel.get("tag_name", "")
              if tag and tag not in ("v0.5.0", "v0.6.0"):
                  alerts.append((
                      f"honker-release-{tag}",
                      f"New russellromney/honker release: {tag}",
                      f"Release URL: {rel.get('html_url')}\n\nCheck PyPI wheel availability and run `uv lock --upgrade-package honker`.",
                  ))
          except Exception as e:
              print(f"Skipping honker release check: {e}")

          if not alerts:
              print("All upstream contracts and repos healthy / unchanged.")
              raise SystemExit(0)

          existing = json.loads(subprocess.check_output(
              ["gh", "issue", "list", "--repo", repo, "--state", "open", "--label", "upstream-watch", "--json", "title,body"],
              text=True,
          ))
          existing_text = "\n".join((i["title"] + "\n" + i["body"]) for i in existing)

          # Ensure label exists
          subprocess.run(["gh", "label", "create", "upstream-watch", "--repo", repo, "--color", "0e8a16", "--force"], check=False)

          for marker, title, body in alerts:
              tag_marker = f"<!-- watch:{marker} -->"
              if tag_marker in existing_text:
                  print(f"Issue already open for {marker}, skipping.")
                  continue
              subprocess.run(
                  ["gh", "issue", "create", "--repo", repo, "--label", "upstream-watch", "--title", title, "--body", f"{body}\n\n{tag_marker}"],
                  check=True,
              )
              print(f"Opened upstream-watch issue: {title}")
          PY
